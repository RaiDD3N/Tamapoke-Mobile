<script>
const $=i=>document.getElementById(i),rnd=Math.random,R=n=>Math.floor(rnd()*n),T=()=>Date.now(),cl=v=>Math.max(0,Math.min(100,v)),dropTo=(v,d,f)=>v<=f?v:(v-f>d?v-d:f);
const LEG=[144,145,146,150,151],RARE=[58,77,83,88,95,106,107,108,111,113,114,115,122,123,124,125,126,127,128,131,132,137,138,140,142,143,147];
const rar=n=>D[n].root?(LEG.includes(n)?3:RARE.includes(n)?2:1):0,EEVEE=133,STARTERS=[1,4,7],FAR=4320,RUN=60;
let S=JSON.parse(localStorage.tp2||'null')||{reg:{},streak:0,best:0,day:0,ms:0,end:0,tm:0,gh:0,sh:0,p:null},p=S.p,lastTick=T(),AC,EV=0,foam=0,lastT=T(),lp,x=120,mode='Idle',dir=2,until=0,mem={};

function say(t){$('msg').textContent=t}

function registerSp(n){const r=S.reg[n]=S.reg[n]||{};r.a=1;if(p.sh)r.s=1}

 for(let pass=0;pass<2;pass++)for(let t=tier;t>=1;t--){const c=[];for(let d=1;d<=151;d++){if(rar(d)!=t)continue;if(pass==0&&!lineUnreg(d))continue;c.push(d)}if(c.length)return c[R(c.length)]}return 1}
function newEgg(){const old=p||{bond:0};p={id:-1,prev:-1,f:80,j:80,e:80,h:100,pp:0,w:0,gA:100,gD:100,gS:100,tA:0,tD:0,tS:0,berry:0,sh:0,age:0,mist:0,cool:0,sl:0,cer:0,cu:0,bond:old.bond,bt:0,nick:'',med:0,neg:0,good:0,taps:0,tgt:0,esh:0,sp:0,ed:0,fd:0,eu:0,hu:0,evu:0};

if(!p)newEgg();
function hatch(){p.id=p.tgt;p.sh=p.esh;p.gA=90+R(21);p.gD=90+R(21);p.gS=90+R(21);p.tA=p.tD=p.tS=0;p.berry=0;p.bond=0;p.bt=0;p.med=0;p.nick='';registerSp(p.id);meds();snd([523,659,784]);save()}
const MD=[['🥉','Niv. 10'],['🥈','Niv. 25'],['🥇','Niv. 50'],['🍓','Baie préférée'],['🔥','7 jours de série'],['💞','Lien max'],['👑','Forme finale'],['💪','En forme']];

 const g=p.med&~b;if(g){for(let m=g;m;m&=m-1)S.tm++;for(let i=0;i<8;i++)if(g>>i&1)say('🏅 Médaille : '+MD[i][1]);snd([784,988,1175]);save()}}

 const m=S.streak>=100?100:S.streak>=30?30:S.streak>=7?7:S.streak>=3?3:0;if(m>(S.mile||0)){S.mile=m;say(`🔥 ${m} jours de suite !`)}meds();save()}

 if(p.sl){p.e=cl(p.e+6);if(p.w>0&&p.age%3==0)p.w--;if(p.age%2==0){p.f=dropTo(p.f,1,30);p.j=dropTo(p.j,1,35)}if(p.age%3==0)p.h=dropTo(p.h,1,45);meds();return}

function sync(){const n=T();let m=p.seen?Math.floor((n-p.seen)/6e4):0;p.seen=n;lastTick=n;if(m<2||p.cer||p.sp)return;hatchOrTick(Math.min(m,20160));save()}

function endLife(k){if(p.id<0||p.cer)return;S.end=k;p.cer=k;p.cu=T()+1e4;p.hu=p.cu;snd([784,659,523]);save()}
function evolve(){if(!canEvo())return;p.prev=p.id;let nx=dex().e[0];if(p.id==EEVEE){const o=[134,135,136].filter(b=>!isReg(b));nx=o.length?o[R(o.length)]:134+R(3)}p.id=nx;registerSp(nx);snd([523,659,784,1047]);p.evu=T()+5200;save()}

function trainStr(h){if(p.cer||p.id<0)return 0;let g=Math.min(18,Math.floor(h/4));const a=p.tA;p.tA=Math.min(100,a+g);g=p.tA-a;p.e=dropTo(p.e,12,5);p.f=dropTo(p.f,5,5);p.w=Math.max(0,p.w-Math.floor(h/3));p.j=cl(p.j+6);if(h>=20)p.hu=T()+1500;if(h>S.sh)S.sh=h;bond(2);care();save();return g}
function act(a){care();if(a=='s'){if(p.id<0||p.cer)return;p.sl=!p.sl;say(p.sl?'Zzz…':'Réveillé !')}else if(guard())say(p.sl?'Il dort…':'');
 else if(a=='f')ov(`<h3>Que lui donner ?</h3><button onclick="cls();berry(0)">🔴 Baie rouge</button><button onclick="cls();berry(1)">🔵 Baie bleue</button><button onclick="cls();berry(2)">🟢 Baie verte</button><button onclick="cls();candy()">🍬 Bonbon</button><button onclick=cls()>Annuler</button>`)

const O=document.createElement('div');O.style.cssText='position:fixed;inset:0;background:#000e;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:9;text-align:center';document.body.appendChild(O);

$('act').onclick=()=>{if(p.id<0&&!p.sp){if(++p.taps>=3)hatch();save()}else if(p.id>=0)p.ed<lv()&&canEvo()?dlgEvo():canBye()&&p.age>=p.fd?dlgBye():canRun()&&dlgRun()};
$('btn').onclick=e=>e.target.dataset.a&&act(e.target.dataset.a);
function game(){if(guard())return;let sc=0,ms=0,bx,by,vx,vy,over=0,last=T(),W=466,go=1;const c2=document.createElement('canvas');c2.width=c2.height=W;c2.style.cssText='width:min(92vw,420px);border-radius:50%;background:#7dd3fc';const g=c2.getContext('2d');
 const rs=()=>{bx=150+R(166);by=96;const s=Math.min(4,1.6+sc*.05);vx=rnd()<.5?s:-s;vy=0};rs();ov('<div>Touche la balle ! 3 ratés = fin</div>');O.appendChild(c2);
 c2.onpointerdown=e=>{if(over)return;const r=c2.getBoundingClientRect(),X=(e.clientX-r.left)*W/r.width,Y=(e.clientY-r.top)*W/r.height;if(Y<72){go=0;cls();return}const dx=bx-X,dy=by-Y;if(dx*dx+dy*dy<74*74){sc++;snd([880]);vy=-(6.6+(sc>16?3.5:sc*.22));vx=Math.max(-6.5,Math.min(6.5,vx+dx*.12))}};
 (function f(){if(!go)return;const n=T();let k=Math.min(3,(n-last)/85);last=n;if(!over){vy+=Math.min(.8,.4+sc*.013)*k;bx+=vx*k;by+=vy*k;const dx=bx-233,dy=by-233,d=Math.hypot(dx,dy);if(d>205){const nx=dx/d,ny=dy/d,dt=vx*nx+vy*ny;if(dt>0){vx=(vx-2*dt*nx)*.85;vy=(vy-2*dt*ny)*.85}bx=233+nx*205;by=233+ny*205}
  if(by>384){if(++ms>=3){playResult(sc);over=n+4000;snd([523,659,784])}else rs()}}
  g.clearRect(0,0,W,W);g.fillStyle='#4ade80';g.fillRect(0,384,W,W);g.font='60px serif';g.textAlign='center';g.fillText('⚾',bx,by+20);g.font='40px system-ui';g.fillStyle='#000';g.fillText(`${sc} · ${'❤'.repeat(3-ms)}`,233,60);
  if(over){g.font='34px system-ui';g.fillText(`Record : ${S.gh}`,233,250)}if(over&&n>over){go=0;cls();return}requestAnimationFrame(f)})()}
function bag(){if(guard())return;let h=0,end=T()+1e4,fin=0;ov('<div id=bt style="font-size:40px"></div><div id=bg style="font-size:110px;user-select:none">🥊</div><div id=tt></div>',()=>{$('bg').onclick=()=>{if(!fin&&T()<end){h++;$('bg').style.transform=`rotate(${h%2?8:-8}deg)`}};const t=setInterval(()=>{const l=Math.max(0,end-T());$('bt').textContent=h+' coups';if(!fin)$('tt').textContent=Math.ceil(l/1e3)+' s';if(!fin&&l==0){fin=1;const g=trainStr(h);$('tt').textContent=`+${g} Force · record ${S.sh}`;setTimeout(()=>{clearInterval(t);cls()},3500)}},100)})}
